<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/no_name.png" />
    <!-- Apply the saved theme before paint to avoid a flash of the wrong colors. -->
    <script>
      (function () {
        try {
          var m = localStorage.getItem('transsync-theme') || 'system';
          var light = m === 'light' ||
            (m === 'system' && window.matchMedia &&
             window.matchMedia('(prefers-color-scheme: light)').matches);
          document.documentElement.classList.add(light ? 'light' : 'dark');
        } catch (e) {}
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TransSync AI</title>
    <!-- Google Fonts: Inter and Manrope -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
